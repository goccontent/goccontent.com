<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản tin Góc Content</title>
<meta property="og:title" content="Bản tin Góc Content">
<meta property="og:description" content="Các số bản tin nhà ATA, Nhà Đom Đóm và các cộng đồng">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;800&display=swap">
<style>
:root { --paper:#fffdf6; --card:#fff; --ink:#14213d; --ink-soft:#3d4763; --ink-mute:#6b7389; --y:#f5c400; --y2:#fff3bf; }
@media (prefers-color-scheme: dark) { :root { --paper:#0f1729; --card:#17213a; --ink:#eef1f8; --ink-soft:#c3c9d8; --ink-mute:#8d95aa; --y2:#3a3416; color-scheme:dark } }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Lexend",system-ui,sans-serif }
.wrap { max-width:720px; margin:0 auto; padding:28px 16px 48px }
.badge { display:inline-flex; align-items:center; gap:8px; padding:6px 14px 6px 6px; background:var(--y); color:#14213d; border-radius:999px; font:800 12px "Lexend"; letter-spacing:.06em; text-transform:uppercase }
.badge svg { width:26px; height:26px; display:block }
h1 { margin:16px 0 6px; font:800 clamp(30px,7vw,42px)/1.1 "Lexend"; letter-spacing:-.02em }
h1 span { background:linear-gradient(transparent 58%, var(--y) 58%) }
.deck { margin:0 0 24px; font:500 14px "Lexend"; color:var(--ink-mute) }
.list { display:grid; gap:14px }
.card { display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center; padding:10px; background:var(--card); border-radius:14px; color:inherit; text-decoration:none; box-shadow:0 1px 0 #0001, 0 6px 18px #14213d14 }
.card:active { transform:translateY(1px) }
.card img { width:120px; height:90px; object-fit:cover; display:block; border-radius:9px }
.card__date { display:inline-block; margin-bottom:4px; padding:1px 8px; background:var(--y2); border-radius:999px; font:600 11.5px "Lexend"; color:var(--ink-soft) }
.card__title { font:800 16px/1.3 "Lexend" }
.end { margin-top:28px; text-align:center; font:700 12px "Lexend"; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-mute) }
</style>
</head>
<body>
<main class="wrap">
<span class="badge"><svg viewBox="0 0 96 96" aria-hidden="true"><path d="M18 10h44l18 18v58H18z" fill="#fff"/><path d="M62 10v18h18z" fill="#14213d"/><text x="48" y="66" text-anchor="middle" font-family="Lexend, sans-serif" font-weight="800" font-size="28" fill="#14213d">GC</text></svg>Góc Content</span>
<h1><span>Bản tin</span> Góc Content</h1>
<p class="deck">Tin mới nhất ở trên cùng</p>
<div class="list">
<a class="card" href="domdom-2026-10-19/"><img src="domdom-2026-10-19/cover.jpg" alt=""><div class="card__body"><div class="card__date">Nhà Đom Đóm · 07–19/10/2026</div><div class="card__title">Bầu xong Ban Đại diện 16 phụ huynh, các gia đình tự nấu cơm cho con từ 13/10</div></div></a>
</div>
<p class="end">Hết danh sách</p>
</main>
</body>
</html>
