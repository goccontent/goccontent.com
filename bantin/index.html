<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản tin Góc Content</title>
<meta property="og:title" content="Bản tin Góc Content">
<meta property="og:description" content="Các số bản tin nhà ATA, Nhà Đom Đóm và các cộng đồng">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,900&family=Caveat:wght@600&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
:root { --paper:#f5efe1; --card:#fffdf7; --ink:#1a1815; --ink-soft:#4a4640; --ink-mute:#8a8377; --leaf-deep:#285e30; --seal:#b8302c; }
@media (prefers-color-scheme: dark) { :root { --paper:#1b1915; --card:#221f1a; --ink:#ece4d2; --ink-soft:#c4bba9; --ink-mute:#8f8777; --leaf-deep:#9fd0a6; --seal:#d0504a; color-scheme:dark } }
* { box-sizing:border-box }
body { margin:0; background:var(--paper); color:var(--ink); font-family:"Be Vietnam Pro",system-ui,sans-serif }
.wrap { max-width:720px; margin:0 auto; padding:28px 16px 48px }
.seal { display:inline-block; padding:6px 10px; background:var(--seal); color:#fff8e7; font:700 12px "Fraunces",serif; letter-spacing:.08em; text-transform:uppercase; box-shadow:3px 3px 0 0 var(--ink) }
h1 { margin:14px 0 4px; font:900 clamp(30px,7vw,44px)/1.05 "Fraunces",serif; letter-spacing:-.02em }
.deck { margin:0 0 22px; font:600 20px "Caveat",cursive; color:var(--ink-mute) }
.list { display:grid; gap:16px }
.card { display:grid; grid-template-columns:120px 1fr; gap:14px; align-items:center; padding:10px; background:var(--card); border:1px solid var(--ink); box-shadow:3px 3px 0 0 var(--leaf-deep); color:inherit; text-decoration:none }
.card:active { transform:translate(2px,2px); box-shadow:1px 1px 0 0 var(--leaf-deep) }
.card img { width:120px; height:90px; object-fit:cover; display:block }
.card__date { font:600 17px "Caveat",cursive; color:var(--ink-mute) }
.card__title { font:700 17px/1.25 "Fraunces",serif }
.end { margin-top:28px; text-align:center; font:600 18px "Caveat",cursive; color:var(--ink-mute) }
</style>
</head>
<body>
<main class="wrap">
<span class="seal">Bản tin 🌱</span>
<h1>Bản tin Góc Content</h1>
<p class="deck">Tin mới nhất ở trên cùng</p>
<div class="list">
<a class="card" href="ata-2026-10-19/"><img src="ata-2026-10-19/cover.jpg" alt=""><div class="card__body"><div class="card__date">Bản tin nhà ATA — 19/10/2026</div><div class="card__title">Đoàn ATA xuống đất Vĩnh Trung lúc 9 giờ, gửi về nhà 75 khung hình từ Nha Trang</div></div></a>
<a class="card" href="domdom-2026-10-19/"><img src="domdom-2026-10-19/cover.jpg" alt=""><div class="card__body"><div class="card__date">Bản tin Nhà Đom Đóm — 07 đến 19/10/2026</div><div class="card__title">Bầu xong Ban Đại diện 16 phụ huynh, các gia đình tự nấu cơm cho con từ 13/10</div></div></a>
</div>
<p class="end">— hết —</p>
</main>
</body>
</html>
